<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3863">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maintenance">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Maintenance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #f3f4f8; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
         padding: 24px; text-align: center; color: #1f3863; }
  .msg h1 { font-size: 20px; margin: 0; }
  .msg p { margin: 0; color: #4a5568; max-width: 320px; line-height: 1.45; }
  .spin { width: 36px; height: 36px; border: 4px solid #d6dcea; border-top-color: #1f3863; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="msg" id="msg"><div class="spin"></div><p>Opening your checklist…</p></div>
<script>
/*
 * Opens the Maintenance checklist app (Google Apps Script) inside this page,
 * so Google's "created by a Google Apps Script user" bar is not shown on top.
 * Only APP_URL needs to be set: the Web app URL from Deploy > Manage deployments.
 * No personal data is stored in this file; each worker's link carries their own code (#w=...).
 */
var APP_URL = 'https://script.google.com/macros/s/AKfycbwJcRmhAY41_1WNojBmO21H78GYy76fwDGAKerSF70lM3eJ17VaJft6ZIht0zedoIU/exec';

(function () {
  var msg = document.getElementById('msg');
  var token = '';
  // The code comes after # (never sent to the web host); ?w= also works.
  try { token = new URLSearchParams(location.hash.replace(/^#/, '')).get('w') || new URLSearchParams(location.search).get('w') || ''; } catch (e) {}
  token = token.replace(/[^A-Za-z0-9]/g, '');
  // Remember the code on this phone, so "Add to Home screen" icons that open without it still work.
  try {
    if (token) localStorage.setItem('mmp_w', token);
    else token = localStorage.getItem('mmp_w') || '';
  } catch (e) {}
  if (!token) {
    msg.innerHTML = '<h1>Maintenance checklist</h1><p>Please open the personal link your supervisor sent you.</p>';
    return;
  }
  var f = document.createElement('iframe');
  f.id = 'app';
  f.title = 'Maintenance checklist';
  f.setAttribute('allow', 'camera; clipboard-write');
  f.setAttribute('referrerpolicy', 'no-referrer');
  f.src = APP_URL + '?w=' + encodeURIComponent(token);
  f.onload = function () { msg.style.display = 'none'; };
  document.body.appendChild(f);
  setTimeout(function () { msg.style.display = 'none'; }, 15000);
})();
</script>
</body>
</html>
